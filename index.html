<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابینو | مدیریت مالی</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0b1220"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
:root{--bg1:#d9e9ff;--bg2:#eef5ff;--g:rgba(255,255,255,.62);--gl:rgba(255,255,255,.85);--tx:#102244;--mu:#5d7194;--pr:#1d6df2;--gr:#0fa968;--rd:#ef4466;--or:#f59e0b;--sh:0 10px 30px rgba(30,90,200,.12);--hero1:#0a3585;--hero2:#1f6df0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#06132b;--bg2:#0a1e3f;--g:rgba(20,40,80,.55);--gl:rgba(120,170,255,.16);--tx:#e8f0ff;--mu:#8ea6cf;--sh:0 10px 30px rgba(0,0,0,.35);--hero1:#072a6b;--hero2:#1858d0}}
:root[data-theme="dark"]{--bg1:#06132b;--bg2:#0a1e3f;--g:rgba(20,40,80,.55);--gl:rgba(120,170,255,.16);--tx:#e8f0ff;--mu:#8ea6cf;--sh:0 10px 30px rgba(0,0,0,.35);--hero1:#072a6b;--hero2:#1858d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--tx);background:linear-gradient(170deg,var(--bg1),var(--bg2) 45%,var(--bg1));background-color:var(--bg2);min-height:100vh}
button,input,select{font:inherit;color:inherit;border:0;background:none}button{cursor:pointer}
.app{max-width:480px;margin:auto;padding:16px 14px 120px}
.g{background:var(--g);border:1px solid var(--gl);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;box-shadow:var(--sh)}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px}
.brand h1{margin:0;font-size:22px;font-weight:800}.brand p{margin:2px 0 0;font-size:12px;color:var(--mu)}
.ib{width:44px;height:44px;border-radius:50%;font-size:19px;display:grid;place-items:center}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:18px;color:#fff;background:linear-gradient(160deg,var(--hero1),var(--hero2));box-shadow:0 18px 40px rgba(20,80,210,.35),inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.12)}
.hero svg.w{position:absolute;inset:auto 0 30% 0;width:100%;opacity:.5;pointer-events:none}
.hero>*{position:relative}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sel{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:9px 14px;font-size:14px}
.sel option{color:#102244}
.date{font-size:13px;opacity:.9}
.bal{margin:14px 0 2px;font-size:38px;font-weight:800;line-height:1.2}.bal small{font-size:30px}
.sub{font-size:13px;opacity:.85}
.chg{display:inline-block;margin:12px 0;padding:7px 14px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:13px}
.up{color:#5cf0a8}.dn{color:#ff8aa0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{padding:10px 8px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);text-align:right}
.st b{display:block;margin-top:8px;font-size:13px;direction:ltr;text-align:right}.st i{font-style:normal;font-size:10px;opacity:.75}.st span{font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.tile{padding:14px 4px 10px;text-align:center;border-radius:20px}
.ti{width:46px;height:46px;border-radius:15px;margin:0 auto 8px;display:grid;place-items:center;font-size:23px}
.tile b{display:block;font-size:12px;font-weight:700}.tile small{font-size:11px}
.acct{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:14px}
.av{width:54px;height:54px;border-radius:16px;background:linear-gradient(160deg,#1d6df2,#38a0ff);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800}
.acct div{flex:1}.acct b{font-size:17px}.acct p{margin:3px 0 0;font-size:12px;color:var(--mu)}
.pill{background:rgba(29,109,242,.14);color:var(--pr);padding:8px 16px;border-radius:14px;font-weight:700;font-size:14px}
.sum{padding:14px;margin-bottom:14px}
.sum h3,.up-h h3{margin:0;font-size:16px;font-weight:800}
.sumb{display:flex;align-items:center;margin-top:10px;background:var(--g);border-radius:18px;padding:12px 6px}
.sumb>div{flex:1;text-align:right;padding:0 12px;border-left:1px solid var(--gl)}.sumb>div:last-child{border:0}
.sumb small{display:block;font-size:12px;margin-bottom:4px}.sumb b{font-size:15px;direction:ltr;display:block;text-align:right}
.ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;flex:none;margin:0 6px}
.ring div{width:58px;height:58px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;text-align:center;font-size:13px;font-weight:700;line-height:1.1}.ring small{display:block;font-size:9px;color:var(--mu);font-weight:400}
.up-h{display:flex;justify-content:space-between;align-items:center;margin:6px 4px 10px}
.link{color:var(--pr);font-size:13px}
.item{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px}
.item .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;flex:none}
.item .m{flex:1;min-width:0}.item .m b{display:block;font-size:15px}.item .m small{color:var(--mu);font-size:12px}
.item .a{text-align:left}.item .a b{display:block;font-size:15px;direction:ltr}
.tag{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:9px;background:rgba(245,158,11,.18);color:var(--or);font-size:11px}
.x{color:var(--rd);font-size:18px;padding:6px}
.empty{text-align:center;color:var(--mu);padding:26px 10px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nb{pointer-events:auto;width:100%;max-width:456px;display:flex;align-items:center;justify-content:space-around;padding:8px 6px;border-radius:30px;position:relative}
.nb button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:18px;font-size:12px;color:var(--mu)}
.nb button span{font-size:22px}.nb button.on{background:rgba(29,109,242,.14);color:var(--pr)}
.fab{width:62px;height:62px;border-radius:50%!important;margin-top:-34px;background:radial-gradient(circle at 35% 30%,#4aa8ff,#1d6df2 70%);color:#fff!important;font-size:34px!important;box-shadow:0 10px 25px rgba(29,109,242,.5),0 0 0 6px var(--bg2);display:grid!important;place-items:center;padding:0!important}
.ov{position:fixed;inset:0;background:rgba(5,15,40,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.ov.o{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:480px;margin:auto;max-height:85vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg2);border:1px solid var(--gl);transform:translateY(105%);transition:transform .25s ease}
.sheet.o{transform:none}
.sheet h2{margin:0 0 14px;font-size:18px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow:auto}
.tabs button{flex:1;white-space:nowrap;padding:10px 8px;border-radius:14px;background:var(--g);border:1px solid var(--gl);font-size:13px}
.tabs button.on{background:var(--pr);color:#fff}
.f{display:block;width:100%;padding:13px 14px;margin-bottom:10px;border-radius:16px;background:var(--g);border:1px solid var(--gl);font-size:15px}
.btn{width:100%;padding:14px;border-radius:16px;background:linear-gradient(160deg,#1d6df2,#3b9bff);color:#fff;font-weight:700;font-size:16px}
.btn.s{width:auto;padding:7px 12px;font-size:12px;border-radius:12px}
.bar{height:10px;border-radius:6px;background:var(--gl);overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;border-radius:6px}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px;margin-bottom:10px}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
@media (max-width:370px){.stats{grid-template-columns:repeat(2,1fr)}.bal{font-size:32px}}
.sm{display:flex;align-items:center;gap:14px;margin-top:12px}
.sm .l{flex:1;display:grid;gap:9px}
.sm .r{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:14px;background:var(--g);border:1px solid var(--gl);font-size:13px}
.sm .r b{direction:ltr;font-size:14px}.sm .r i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:7px}
.rg{position:relative;width:104px;height:104px;flex:none}.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:20px;font-weight:800;line-height:1.2}
.rg small{display:block;font-size:10px;font-weight:400;color:var(--mu);max-width:64px}
.ch{padding:14px;margin-bottom:14px}.ch h3{margin:0;font-size:16px}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mu)}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-left:5px}
.dt{font-size:14px;font-weight:700;margin-top:3px;color:var(--pr)}
.logo{object-fit:cover}.f.j{width:auto;flex:1;padding:12px 6px;margin:0}.f.j option{color:#102244}
button.acct{width:100%;text-align:right}

:root{--bg1:#e4edf9;--bg2:#f4f8fd;--g:rgba(255,255,255,.58);--gl:rgba(255,255,255,.8);--tx:#14213d;--mu:#6a7a96;--pr:#2f6fe4;--sh:0 6px 24px rgba(30,60,120,.07);--hero1:#0c1f4a;--hero2:#1c4aa8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#070f20;--bg2:#0b1830;--g:rgba(255,255,255,.055);--gl:rgba(255,255,255,.1);--tx:#e9eefb;--mu:#8b9bbd;--sh:0 6px 24px rgba(0,0,0,.35);--hero1:#0a1a40;--hero2:#16399a}}
:root[data-theme="dark"]{--bg1:#070f20;--bg2:#0b1830;--g:rgba(255,255,255,.055);--gl:rgba(255,255,255,.1);--tx:#e9eefb;--mu:#8b9bbd;--sh:0 6px 24px rgba(0,0,0,.35);--hero1:#0a1a40;--hero2:#16399a}
body{background:radial-gradient(900px 500px at 90% -5%,rgba(80,130,255,.18),transparent 60%),radial-gradient(700px 500px at 0 35%,rgba(200,170,110,.12),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));background-color:var(--bg2);background-attachment:fixed}
.g{border-radius:20px;backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4)}
.brand h1{font-weight:700;font-size:21px}.ib{width:40px;height:40px;color:var(--mu)}
.hero{border-radius:26px;box-shadow:0 18px 40px rgba(12,31,74,.26),inset 0 1px 0 rgba(255,255,255,.28)}
.tiles{gap:9px}.tile{padding:13px 2px 10px;border-radius:18px;transition:transform .15s}.tile:active{transform:scale(.95)}
.ti{width:40px;height:40px;border-radius:13px;margin-bottom:7px;border:1px solid var(--gl)}.ti svg{width:20px;height:20px}
.tile b{font-size:11.5px;font-weight:600}.tile small{font-size:10.5px}
.item .ic svg,.av svg{width:21px;height:21px}.item .ic{width:42px;height:42px;border-radius:14px}.av{border-radius:15px}
.pill{background:linear-gradient(135deg,#f6e6bd,#d9b46a);color:#5a3f0e;font-size:12px;padding:6px 13px}
.nb{border-radius:26px;padding:6px 4px}.nb button{font-size:11px}.nb button svg{display:block}.fab{width:56px;height:56px;margin-top:-30px;font-size:30px!important}
.sheet{border-radius:26px 26px 0 0}.x{font-size:16px;padding:6px 8px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav><div class="nb g">
<button class="on" data-a="home"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg></span>خانه</button>
<button data-a="list" data-k="ins"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg></span>اقساط</button>
<button class="fab" data-a="add" data-k="exp" aria-label="ثبت جدید">+</button>
<button data-a="rep"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>گزارش‌ها</button>
<button data-a="set"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 7m-2 0a2 2 0 104 0 2 2 0 10-4 0M9 17m-2 0a2 2 0 104 0 2 2 0 10-4 0"/></svg></span>تنظیمات</button>
</div></nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sh" role="dialog" aria-modal="true"></div>
<script>
const KEY='hesabino-v1';
const K={inc:{n:'درآمد',e:'📈',c:'#0fa968',bg:'rgba(15,169,104,.15)',p:'مثلاً: حقوق، فروش تعمیرات'},
exp:{n:'هزینه',e:'📉',c:'#ef4466',bg:'rgba(239,68,102,.15)',p:'مثلاً: اجاره، خرید قطعه'},
ins:{n:'قسط',e:'🏦',c:'#1d6df2',bg:'rgba(29,109,242,.15)',p:'مثلاً: بانک ملت - وام خودرو'},
debt:{n:'بدهی',e:'👥',c:'#f59e0b',bg:'rgba(245,158,11,.18)',p:'مثلاً: طلب از مشتری'},
sav:{n:'پس‌انداز',e:'💰',c:'#7c5cf0',bg:'rgba(124,92,240,.15)',p:'مثلاً: صندوق اضطراری'},
col:{n:'همکار',e:'🤝',c:'#0e9f9a',bg:'rgba(14,159,154,.15)',p:'نام همکار'}};
const fa=n=>Math.round(n).toLocaleString('fa-IR');
const D=(off=0)=>{const d=new Date();d.setDate(d.getDate()+off);return d.toLocaleDateString('sv')};
const dt=s=>new Date(s+'T12:00:00');
const jf=(s,o)=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',o).format(dt(s));
const mk=s=>{const p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric'}).formatToParts(dt(s));return p.find(x=>x.type==='year').value+'-'+p.find(x=>x.type==='month').value};
const dig=s=>String(s).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/\D/g,'');
let id=0;const T=(k,t,a,d)=>({id:++id+Date.now(),k,t,a,d});
function seed(){return{hide:false,theme:'',tx:[
T('inc','فروش و تعمیرات',12400000,D(-3)),T('inc','فروش وی‌پی‌ان',6500000,D(-1)),
T('exp','خرید قطعات',7340000,D(-2)),T('exp','اجاره مغازه',5000000,D(-4)),
T('ins','بانک ملت - وام خودرو',2500000,D(3)),T('ins','بانک مهر - قسط ۲',2000000,D(12)),
T('debt','مشتری: آقای رضایی',1800000,D(-5)),T('debt','مشتری: خانم احمدی',1000000,D(-8)),
T('sav','صندوق اضطراری',3000000,D(-6)),
T('inc','حقوق ماه قبل',18300000,D(-34)),T('exp','هزینه‌های ماه قبل',11000000,D(-33))]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tx)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let cur=mk(D());
const $=q=>document.querySelector(q);
const sum=(k,m)=>S.tx.filter(x=>x.k===k&&(!m||mk(x.d)===m)).reduce((a,x)=>a+x.a,0);
const mask=s=>S.hide?'••••••':s;
function months(){const o=[];for(let i=0;i<9;i++){const d=D(-28*i);const m=mk(d);if(!o.find(x=>x.m===m))o.push({m,s:jf(d,{month:'long'}),l:jf(d,{month:'long',year:'numeric'})})}return o.slice(0,6)}
function theme(){const t=S.theme;if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
function prevKey(){const [y,m]=cur.split('-').map(Number);return m===1?(y-1)+'-12':y+'-'+(m-1)}
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const jp=s=>{const p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(dt(s));const g=t=>+p.find(x=>x.type===t).value;return[g('year'),g('month'),g('day')]};
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+~~(jy/33)*8+~~((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365}let gd=days+1;const sa=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13&&gd>sa[gm];gm++)gd-=sa[gm];return[gy,gm,gd]}
function jsel(s,lb){const[y,m,d]=jp(s);let ds='',ms='',ys='';for(let i=1;i<=31;i++)ds+=`<option value="${i}"${i===d?' selected':''}>${i.toLocaleString('fa-IR')}</option>`;MN.forEach((n,i)=>ms+=`<option value="${i+1}"${i+1===m?' selected':''}>${n}</option>`);for(let i=y-2;i<=y+3;i++)ys+=`<option value="${i}"${i===y?' selected':''}>${i.toLocaleString('fa-IR',{useGrouping:false})}</option>`;
return `<small style="color:var(--mu)">${lb} (شمسی)</small><div class="row" style="gap:6px;margin:4px 0 12px"><select class="f j" id="jd" aria-label="روز">${ds}</select><select class="f j" id="jm" aria-label="ماه" onchange="jfix()">${ms}</select><select class="f j" id="jy" aria-label="سال" onchange="jfix()">${ys}</select></div>`}
function chart(){const v=months().reverse().map(o=>[sum('inc',o.m),sum('exp',o.m),o.s]);const mx=Math.max(1,...v.map(x=>Math.max(x[0],x[1])));const st=340/v.length;let b='<line x1="0" x2="340" y1="125" y2="125" stroke="var(--gl)"/>';
